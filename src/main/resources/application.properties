spring.application.name=demo
# 설정 파일의 주석은 #으로 작성

# 서버의 포트를 지정
# 톰캣 서버의 기본 포트 : 8080
server.port = 8080

# 뷰템플릿에 따라 설정이 달라질 수 있다
# .jsp
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html

#데이터베이스의 접속정보
spring.datasource.url=jdbc:mysql://localhost:3306/hr?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
spring.datasource.username=emp
spring.datasource.password=1234
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# xml파일의 위치
mybatis.mapper-locations=classpath:mapper/*.xml
# resultType 의 패키지 정보
mybatis.type-aliases-package=com.example.demo.dto 
# 기본은 스네이크표기법 -> 카멜표기법으로 변경
mybatis.configuration.map-underscore-to-camel-case=true


